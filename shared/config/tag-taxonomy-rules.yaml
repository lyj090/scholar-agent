version: 3
updated_for: zotero-obsidian-unified-tagging
principles:
  - use_lowercase_only
  - use_english_only
  - prefer_prefixed_tags
  - avoid_duplicate_synonyms
  - keep_tags_sparse_and_high_value

tag_prefixes:
  type: document role (paper, concept, project, index, map, web-clip)
  area: broad knowledge domain (robotics, ml, control-theory)
  topic: reusable research theme
  method: core method, algorithm, or theory family
  task: what the work solves (motion-planning, grasping)
  software: named library or framework
  hardware: physical platform or sensor
  source: origin or venue (zotero, conference, journal)
  rel: relationship to my work (project binding, usage role, thesis relevance)
  status: lifecycle state

default_tags:
  - type/paper
  - status/to-read

limits:
  type: 1
  area: 2
  topic: 3
  method: 3
  task: 3
  software: 2
  hardware: 2
  source: 2
  rel: 3
  status: 1

