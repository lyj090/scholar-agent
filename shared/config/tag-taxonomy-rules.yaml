  read: status/read

rules:
  tagging_order:
    - type
    - area
    - topic
    - method
    - task
    - software
    - hardware
    - source
    - rel
    - status
  status_policy: keep_only_one_primary_status
  language_policy: do_not_create_chinese_tags
  case_policy: lowercase_only
  synonym_policy: keep_only_canonical_mapped_form
  sparsity_policy: do_not_overtag

folder_defaults:
  "02-Literature/ZoteroNotes/**":
    required: [type/*]
    recommended: [area/*, topic/*, status/*]
    allowed: [method/*, task/*, software/*, hardware/*, source/*, rel/*, status/*]
  "03-Concepts/**":
    required: [type/*]
    recommended: [area/*]
    allowed: [topic/*, method/*]
  "01-Projects/**":
    required: [type/project]
    allowed: [rel/*, area/*]
  "02-Literature/WebNotes/**":
    required: [type/web-clip]
    recommended: [area/*]
    allowed: [topic/*, method/*, source/*]

notes:
  - prefer tags that can be reused across multiple notes
  - do not create a new tag unless it is likely to recur
  - use software/ for named libraries and toolkits
  - use task/ for what the work solves
  - use method/ for how the work solves it
  - use area/ for broad domains (fewer, more stable than topic/)
  - use source/ for where it came from (venue, database, import origin)
  - use rel/ for how this relates to my work (project, usage, thesis)
